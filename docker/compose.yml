services:
  vault:
    image: hashicorp/vault:2.2.0@sha256:e0acd3c681bdf57f002d7214e5d050b876e1704678005c6b0406dd96a65be919
    command: ["server", "-dev"]
    group_add:
      - "${DOCKER_GID:?}"
    network_mode: bridge
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_ADDR: http://127.0.0.1:8200
      DOCKER_HOST: unix:///var/run/docker.sock
      VAULT_PLUGIN_TMPDIR: /tmp/vault-plugin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/vault-plugin:/tmp/vault-plugin
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 1s
      timeout: 5s
      retries: 30
