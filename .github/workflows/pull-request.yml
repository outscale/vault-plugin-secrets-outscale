name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      - name: Run unit tests
        run: go test -v -count=1 ./...

  acceptance:
    name: Acceptance Tests
    needs: unit
    environment: eu-west-2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: outscale/frieza-github-actions/frieza-clean@1a8eba5199913da60ae6d92d6050e17410186a38 # v0.16.1
        with:
            access_key: ${{ secrets.OSC_ACCESS_KEY }}
            secret_key: ${{ secrets.OSC_SECRET_KEY }}
            region: ${{ secrets.OSC_REGION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      - name: Run acceptance tests
        env:
          VAULT_ACC: "1"
          OSC_ACCESS_KEY: ${{ secrets.OSC_ACCESS_KEY }}
          OSC_SECRET_KEY: ${{ secrets.OSC_SECRET_KEY }}
          OSC_REGION: ${{ secrets.OSC_REGION }}
          CGO_ENABLED: 0
        run: go test -v -run '^TestAcc' -timeout=5m -parallel=4 -count 1 ./...

  stepwise:
    name: Stepwise Tests
    needs: acceptance
    environment: eu-west-2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: outscale/frieza-github-actions/frieza-clean@1a8eba5199913da60ae6d92d6050e17410186a38 # v0.16.1
        with:
            access_key: ${{ secrets.OSC_ACCESS_KEY }}
            secret_key: ${{ secrets.OSC_SECRET_KEY }}
            region: ${{ secrets.OSC_REGION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      - name: Run stepwise tests
        env:
          VAULT_ACC: "1"
          OSC_ACCESS_KEY: ${{ secrets.OSC_ACCESS_KEY }}
          OSC_SECRET_KEY: ${{ secrets.OSC_SECRET_KEY }}
          OSC_REGION: ${{ secrets.OSC_REGION }}
          CGO_ENABLED: 0
        run: go test -v -run '^TestStepwise' -timeout=2m -count=1 .
