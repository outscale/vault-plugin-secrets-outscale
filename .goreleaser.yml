version: 2

before:
  hooks:
    - go mod tidy

builds:
- env:
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X {{ .ModulePath }}/version.version={{.Version}}'
  goos:
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm64
  ignore:
    - goos: windows
      goarch: arm64
    - goos: darwin
      goarch: '386'
    - goos: linux
      goarch: '386'
  main: ./cmd/vault-plugin-secrets-outscale/main.go

dockers_v2:
  - images:
      - vault-plugin-secrets-outscale
    dockerfile: docker/Dockerfile
    tags:
      - test
    # We skip publishing for now
    disable: '{{ not .IsSnapshot }}'

archives:
- formats: [zip]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: true

changelog:
  use: github
