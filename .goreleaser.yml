version: 2

before:
  hooks:
    - go mod tidy

builds:
- env:
    - CGO_ENABLED=0
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
  ldflags:
    - '-s -w -X {{ .ModulePath }}.Version=v{{ .Version }}'
  goos:
    - windows
    - linux
    - darwin
  goarch:
    - amd64
    - '386'
    - arm64
  ignore:
    - goos: windows
      goarch: arm64
    - goos: darwin
      goarch: '386'
    - goos: linux
      goarch: '386'
  main: ./cmd/vault-plugin-secrets-outscale/main.go

dockers_v2:
  - images:
      - ghcr.io/outscale/vault-plugin-secrets-outscale
    dockerfile: docker/Dockerfile
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsNightly }}latest{{ end }}"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

docker_signs:
  - cmd: cosign
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
    output: true

archives:
- formats: [zip]
  name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

release:
  draft: true

changelog:
  use: github
